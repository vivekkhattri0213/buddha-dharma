<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" role="img" aria-labelledby="t2 d2">
<title id="t2">Dependent co-arising in one everyday moment</title>
<desc id="d2">Six steps from a message marked seen with no reply: contact, feeling, craving, clinging, becoming, stress. Craving is highlighted as the place to catch the chain.</desc>
<rect width="760" height="560" rx="16" fill="#fffdf9"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="380" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2622">One ordinary moment, step by step</text>
<rect x="40" y="56" width="150" height="56" rx="10" fill="#fdf0dc" stroke="#d9902f" stroke-width="2"/><text x="115.0" y="89.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Contact</text>
<rect x="210" y="56" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="89.0" font-size="14" fill="#2a2622">Your phone buzzes: a message is marked &quot;seen&quot;, no reply.</text>
<line x1="115" y1="114" x2="115" y2="128" stroke="#6b635a" stroke-width="2.5"/><polygon points="115,134 110,126 120,126" fill="#6b635a"/>
<rect x="40" y="136" width="150" height="56" rx="10" fill="#fdf0dc" stroke="#d9902f" stroke-width="2"/><text x="115.0" y="169.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Feeling</text>
<rect x="210" y="136" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="169.0" font-size="14" fill="#2a2622">A sinking, unpleasant feeling in the stomach.</text>
<line x1="115" y1="194" x2="115" y2="208" stroke="#6b635a" stroke-width="2.5"/><polygon points="115,214 110,206 120,206" fill="#6b635a"/>
<rect x="40" y="216" width="150" height="56" rx="10" fill="#ffe3cf" stroke="#c2410c" stroke-width="2"/><text x="115.0" y="249.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Craving</text>
<rect x="210" y="216" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="249.0" font-size="14" fill="#2a2622">&quot;I NEED a reply.&quot; / &quot;I want this feeling gone.&quot;</text>
<rect x="34" y="210" width="692" height="68" rx="14" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="115" y1="274" x2="115" y2="288" stroke="#6b635a" stroke-width="2.5"/><polygon points="115,294 110,286 120,286" fill="#6b635a"/>
<rect x="40" y="296" width="150" height="56" rx="10" fill="#fdf0dc" stroke="#d9902f" stroke-width="2"/><text x="115.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Clinging</text>
<rect x="210" y="296" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="329.0" font-size="14" fill="#2a2622">You grab the story: &quot;They're ignoring me. They don't respect me.&quot;</text>
<line x1="115" y1="354" x2="115" y2="368" stroke="#6b635a" stroke-width="2.5"/><polygon points="115,374 110,366 120,366" fill="#6b635a"/>
<rect x="40" y="376" width="150" height="56" rx="10" fill="#fdf0dc" stroke="#d9902f" stroke-width="2"/><text x="115.0" y="409.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Becoming</text>
<rect x="210" y="376" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="409.0" font-size="14" fill="#2a2622">You become &quot;the person being rejected&quot; and act like it.</text>
<line x1="115" y1="434" x2="115" y2="448" stroke="#6b635a" stroke-width="2.5"/><polygon points="115,454 110,446 120,446" fill="#6b635a"/>
<rect x="40" y="456" width="150" height="56" rx="10" fill="#fbe4e4" stroke="#c25a5a" stroke-width="2"/><text x="115.0" y="489.0" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2622">Stress</text>
<rect x="210" y="456" width="510" height="56" rx="10" fill="#ffffff" stroke="#e7e0d5" stroke-width="2"/>
<text x="228" y="489.0" font-size="14" fill="#2a2622">A bad mood, a rude reply, a ruined evening.</text>
<text x="380" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Catch it here: feeling is automatic, but craving is not compulsory.</text>
</g></svg>